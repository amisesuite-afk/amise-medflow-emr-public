name: AmiseMedFlow

options:
  bundleIdPrefix: com.amise
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"   # sets LastUpgradeCheck so Xcode 26 stops showing "Update to recommended settings"
  defaultConfig: Debug

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1
  # Crash + app-hang reporting (see Services/CrashReporting.swift). Pinned to 8.x.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.36.0

targets:
  AmiseMedFlow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: AmiseMedFlow
        excludes:
          - "**/.DS_Store"
      # Clinical rules shared with the web (clinical-content/rules/*.json at the repository root),
      # copied into the app bundle as the "rules" folder reference, so a new file needs no
      # per-file registration. Read by Services/SharedClinicalContent.swift; the web imports the
      # same files. lint:shared-content fails if this entry goes.
      - path: ../clinical-content/rules
        type: folder
        buildPhase: resources
      # Disease-centred vademecum (phase 1, shadow: decoded only, VademecumContent.swift), bundled
      # as the "vademecum" folder reference. lint:shared-content fails if this entry goes.
      - path: ../clinical-content/vademecum
        type: folder
        buildPhase: resources

    resources:
      - path: AmiseMedFlow/Assets.xcassets

    info:
      path: AmiseMedFlow/Info.plist
      properties:
        CFBundleDisplayName: "Amise MedFlow"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
        # NAS backup over Tailscale uses the NAS's short MagicDNS name over HTTP (e.g.
        # http://amise-storage:5005). Tailscale encrypts that traffic end to end (WireGuard), so
        # plain HTTP is allowed for local names only; every other connection stays HTTPS-only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Supabase — resolved at build time via Configuration.xcconfig
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        # Sentry crash reporting — empty = reporting off
        SENTRY_DSN: "$(SENTRY_DSN)"
        # Privacy usage strings
        NSCameraUsageDescription: "Camera is used for patient photo documentation."
        NSPhotoLibraryUsageDescription: "Photo library is used for attaching clinical images."
        NSCalendarsUsageDescription: "Calendar access lets MedFlow display your operating schedule alongside patient cases."
        NSCalendarsFullAccessUsageDescription: "Full calendar access lets MedFlow create theatre bookings and display your operating schedule alongside clinical data."
        NSFaceIDUsageDescription: "Face ID projects patient records and clinical data in Amise MedFlow."
        NSMicrophoneUsageDescription: "Microphone access enables voice dictation for clinical notes and operative documentation."
        NSSpeechRecognitionUsageDescription: "Speech recognition converts your dictation into structured clinical notes."
        # Local network — Multipeer Connectivity for peer-to-peer device sync
        NSLocalNetworkUsageDescription: "MedFlow uses local networking to sync patient data between your devices on the same network."
        NSBonjourServices:
          - "_amise-medflow._tcp"
          - "_amise-medflow._udp"
        # Encryption compliance — app uses HTTPS (exempt from export regs)
        ITSAppUsesNonExemptEncryption: false
        # Report PDFs shared from another app (Laboratory Services Ltd "SLUlabservices", Files,
        # Safari): "Open in / Copy to MedFlow". Not in place: iOS copies the file into
        # Documents/Inbox and calls .onOpenURL (Services/IncomingReportStaging.swift).
        CFBundleDocumentTypes:
          - CFBundleTypeName: "PDF report"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        LSSupportsOpeningDocumentsInPlace: false

    entitlements:
      path: AmiseMedFlow/AmiseMedFlow.entitlements
      properties: {}

    # Target-level key: XcodeGen ignores configFiles nested under settings, which is why
    # Configuration.xcconfig (SENTRY_DSN, SUPABASE_*) was never applied before.
    configFiles:
      Debug: Configuration.xcconfig
      Release: Configuration.xcconfig

    settings:
      base:
        PRODUCT_NAME: AmiseMedFlow
        PRODUCT_BUNDLE_IDENTIFIER: com.amise.medflow
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: A5KKWX89SG
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: match AppStore com.amise.medflow
          ENABLE_PREVIEWS: "NO"

    dependencies:
      - package: Supabase
        product: Supabase
      - package: Sentry
        product: Sentry

  AmiseMedFlowTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: AmiseMedFlowTests
        excludes:
          - "**/.DS_Store"
          - "ClinicalValidation/Vignettes"
          - "ClinicalValidation/Vignettes/**"
      # Clinical validation vignettes (JSON), copied into the test bundle as a "Vignettes" folder
      # reference so ClinicalValidationTests can enumerate them. The web harness reads the same files.
      - path: AmiseMedFlowTests/ClinicalValidation/Vignettes
        type: folder
        buildPhase: resources

    settings:
      base:
        PRODUCT_NAME: AmiseMedFlowTests
        PRODUCT_BUNDLE_IDENTIFIER: com.amise.medflow.tests
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: A5KKWX89SG
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AmiseMedFlow.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AmiseMedFlow
        BUNDLE_LOADER: $(TEST_HOST)

    dependencies:
      - target: AmiseMedFlow

  # UI walkthrough (XCUITest): launches the app in DEBUG demo mode (-UITestDemoMode, synthetic
  # in-memory data, no sync) and screenshots each step. Run through the AmiseMedFlowUIWalkthrough
  # scheme only (ios/ui-walkthrough.sh, .github/workflows/ios-ui-walkthrough.yml), so the
  # AmiseMedFlow scheme's unit tests are unchanged.
  AmiseMedFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: AmiseMedFlowUITests
        excludes:
          - "**/.DS_Store"

    settings:
      base:
        PRODUCT_NAME: AmiseMedFlowUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.amise.medflow.uitests
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: A5KKWX89SG
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: AmiseMedFlow

    dependencies:
      - target: AmiseMedFlow

schemes:
  AmiseMedFlow:
    build:
      targets:
        AmiseMedFlow: all
        AmiseMedFlowTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AmiseMedFlowTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # UI walkthrough only (Debug: demo mode exists only in DEBUG builds).
  AmiseMedFlowUIWalkthrough:
    build:
      targets:
        AmiseMedFlow: all
        AmiseMedFlowUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AmiseMedFlowUITests

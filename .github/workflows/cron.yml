name: Scheduled Cron Jobs

on:
  schedule:
    # Reminders: every 30 minutes
    - cron: '*/30 * * * *'
    # Daily summary: 6:00 AM ECT (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which cron job to run'
        required: true
        type: choice
        options:
          - all
          - reminders
          - booking-reminders
          - staff-escalation
          - daily-summary

# ── Helper: wake Render and verify CRON_SECRET is configured ──────────────────
# Every job runs a warm-up step first (--max-time 90 handles a full cold-start).
# curl -f exits 22 on 4xx/5xx; --write-out prints status + body for diagnosis.

jobs:
  reminders:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'reminders')
      || github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Wake API (handle cold-start)
        run: |
          echo "Warming up Render instance…"
          curl -sf -o /dev/null -w "Health: HTTP %{http_code} in %{time_total}s\n" \
            --max-time 90 \
            https://amise-medflow-api.onrender.com/api/healthz

      - name: Trigger appointment reminders
        run: |
          HTTP=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://amise-medflow-api.onrender.com/api/cron/reminders)
          echo "HTTP $HTTP — $(cat /tmp/body.txt)"
          [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] || exit 1

  booking-reminders:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'booking-reminders')
      || github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Wake API (handle cold-start)
        run: |
          echo "Warming up Render instance…"
          curl -sf -o /dev/null -w "Health: HTTP %{http_code} in %{time_total}s\n" \
            --max-time 90 \
            https://amise-medflow-api.onrender.com/api/healthz

      - name: Trigger booking reminders
        run: |
          HTTP=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://amise-medflow-api.onrender.com/api/cron/booking-reminders)
          echo "HTTP $HTTP — $(cat /tmp/body.txt)"
          [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] || exit 1

  staff-escalation:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'staff-escalation')
      || github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Wake API (handle cold-start)
        run: |
          echo "Warming up Render instance…"
          curl -sf -o /dev/null -w "Health: HTTP %{http_code} in %{time_total}s\n" \
            --max-time 90 \
            https://amise-medflow-api.onrender.com/api/healthz

      - name: Trigger staff escalation check
        run: |
          HTTP=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://amise-medflow-api.onrender.com/api/cron/staff-escalation)
          echo "HTTP $HTTP — $(cat /tmp/body.txt)"
          [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] || exit 1

  daily-summary:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'daily-summary')
      || github.event_name == 'schedule' && github.event.schedule == '0 10 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Wake API (handle cold-start)
        run: |
          echo "Warming up Render instance…"
          curl -sf -o /dev/null -w "Health: HTTP %{http_code} in %{time_total}s\n" \
            --max-time 90 \
            https://amise-medflow-api.onrender.com/api/healthz

      - name: Trigger daily summary
        run: |
          HTTP=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://amise-medflow-api.onrender.com/api/cron/daily-summary)
          echo "HTTP $HTTP — $(cat /tmp/body.txt)"
          [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] || exit 1

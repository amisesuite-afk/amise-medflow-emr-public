name: Keep API Server Warm

on:
  schedule:
    # Every 10 minutes — Render free tier spins down after ~15 minutes idle.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf -o /dev/null -w "amise-medflow-api: HTTP %{http_code} in %{time_total}s\n" \
            --max-time 90 \
            https://amise-medflow-api.onrender.com/api/healthz

name: Keep API Server Warm

# Render Starter plan does not spin down — this is a lightweight hourly
# liveness check only, not a keep-warm loop.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf -o /dev/null -w "amise-medflow-api: HTTP %{http_code} in %{time_total}s\n" \
            --max-time 30 \
            https://amise-medflow-api.onrender.com/api/healthz \
            || echo "WARN: health check failed"

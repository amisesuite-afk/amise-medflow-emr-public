name: Keep API Server Warm

# Render Starter ($7/mo) still sleeps after ~15 min idle.
# Each run pings 7 times × 13-min sleep = ~91 min coverage.
# Four schedule entries improve chances of GitHub firing at least one per hour.
on:
  schedule:
    - cron: '0 * * * *'
    - cron: '15 * * * *'
    - cron: '30 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Ping every 13 minutes (7 rounds)
        run: |
          for i in 1 2 3 4 5 6 7; do
            echo "=== Round $i/7 — $(date -u '+%H:%M:%S UTC') ==="
            curl -sf -o /dev/null \
              -w "amise-medflow-api: HTTP %{http_code} in %{time_total}s\n" \
              --max-time 90 \
              https://amise-medflow-api.onrender.com/api/healthz \
              || echo "WARN: ping failed (cold-start in progress)"
            [ $i -lt 7 ] && sleep 780
          done

name: Deploy — Amise Front Desk (Vercel)

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install

      - name: Discover Vercel org and project IDs
        id: vercel-ids
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== User info ==="
          USER_JSON=$(curl -sf "https://api.vercel.com/v2/user" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "$USER_JSON" | python3 -c "
          import sys, json; u=json.load(sys.stdin)['user']
          print(f\"username={u.get('username')}  id={u.get('id')}\")
          " || true

          echo "=== Teams ==="
          TEAMS_JSON=$(curl -sf "https://api.vercel.com/v2/teams" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "$TEAMS_JSON" | python3 -c "
          import sys, json
          for t in json.load(sys.stdin).get('teams', []):
            print(f\"  slug={t.get('slug')}  id={t.get('id')}\")
          " || true

          echo "=== Projects ==="
          PROJ_JSON=$(curl -sf "https://api.vercel.com/v9/projects?limit=100" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "$PROJ_JSON" | python3 -c "
          import sys, json
          for p in json.load(sys.stdin).get('projects', []):
            aliases = [a.get('domain','') for a in p.get('alias', [])]
            print(f\"  name={p['name']}  id={p['id']}  aliases={aliases}\")
          " || echo "$PROJ_JSON"

          # Extract org ID (prefer team, fall back to personal user ID)
          ORG_ID=$(echo "$TEAMS_JSON" | python3 -c "
          import sys, json
          teams = json.load(sys.stdin).get('teams', [])
          print(teams[0]['id'] if teams else '')
          " 2>/dev/null || true)

          if [ -z "$ORG_ID" ]; then
            ORG_ID=$(echo "$USER_JSON" | python3 -c "
          import sys, json; print(json.load(sys.stdin)['user']['id'])
          " 2>/dev/null || true)
          fi

          # Find the front-desk project ID
          PROJECT_ID=$(echo "$PROJ_JSON" | python3 -c "
          import sys, json
          ps = json.load(sys.stdin).get('projects', [])
          p = next((x for x in ps if x['name'] == 'front-desk'), None)
          print(p['id'] if p else '')
          " 2>/dev/null || true)

          echo "org_id=$ORG_ID" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "VERCEL_ORG_ID=$ORG_ID" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

          {
            echo "## Vercel project discovery"
            echo '```'
            echo "ORG_ID=$ORG_ID"
            echo "PROJECT_ID=$PROJECT_ID"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Vercel project (rootDirectory + env vars)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.vercel-ids.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-ids.outputs.project_id }}
        run: |
          # Set rootDirectory so source deploy from repo root finds the right package
          echo "=== Setting rootDirectory ==="
          curl -sf -X PATCH \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory": "artifacts/front-desk"}' \
            | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          print(f\"rootDirectory={r.get('rootDirectory')}  framework={r.get('framework')}\")
          " || true

          # Upsert NEXT_PUBLIC env vars so they are available during Vercel's build
          echo "=== Setting env vars ==="
          for payload in \
            '{"key":"NEXT_PUBLIC_SUPABASE_URL","value":"https://nornhfzfrlmfzaqmrzzp.supabase.co","target":["production","preview","development"],"type":"plain"}' \
            '{"key":"NEXT_PUBLIC_SUPABASE_ANON_KEY","value":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vcm5oZnpmcmxtZnphcW1yenpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5OTU5NjcsImV4cCI6MjA5NDU3MTk2N30.IQqwEuwp4_CYRj5r6H-83vjXKeob-N8z5TBwLk-rXLc","target":["production","preview","development"],"type":"plain"}'; do
            curl -sf -X POST \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&upsert=true" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" > /dev/null 2>&1 || true
          done
          echo "Done configuring project"

      - name: Deploy to Vercel (production — source build)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.vercel-ids.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-ids.outputs.project_id }}
          NEXT_PUBLIC_SUPABASE_URL: https://nornhfzfrlmfzaqmrzzp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vcm5oZnpmcmxtZnphcW1yenpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5OTU5NjcsImV4cCI6MjA5NDU3MTk2N30.IQqwEuwp4_CYRj5r6H-83vjXKeob-N8z5TBwLk-rXLc
        run: |
          set -e
          echo '=== Vercel deploy (production from source) ==='
          # Deploy from repo root — Vercel uses rootDirectory=artifacts/front-desk to build.
          # No --prebuilt: Vercel builds in their environment so pnpm paths are correct.
          npx vercel@54.6.1 deploy --prod --yes --no-color --token="$VERCEL_TOKEN" 2>&1 | tee /tmp/vdeploy.txt
          echo '=== end ==='

          # Extract the deployment-specific URL.
          # Pattern stops at .vercel.app boundary — avoids capturing "Building…" suffix.
          URL=$(sed 's/\x1b\[[0-9;]*[mK]//g' /tmp/vdeploy.txt \
            | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' \
            | grep -v 'inspect' | tail -1)

          # Fallback: last non-empty line
          if [ -z "$URL" ]; then
            URL=$(sed 's/\x1b\[[0-9;]*[mK]//g' /tmp/vdeploy.txt \
              | grep -v '^[[:space:]]*$' | tail -1 | tr -d '[:space:]')
          fi

          echo "LIVE_URL=$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "LIVE_URL=$URL" >> "$GITHUB_ENV"

          {
            echo "## Live URL"
            echo ""
            echo "**$URL**"
            echo ""
            echo "<details><summary>vercel deploy log</summary>"
            echo ""
            echo '```'
            cat /tmp/vdeploy.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Force-assign production alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          LIVE_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_ORG_ID: ${{ steps.vercel-ids.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-ids.outputs.project_id }}
        run: |
          if [ -n "$LIVE_URL" ] && [[ "$LIVE_URL" == https://* ]]; then
            echo "Assigning production alias to $LIVE_URL"
            npx vercel@54.6.1 alias set "$LIVE_URL" \
              front-desk-amisesuite-afks-projects.vercel.app \
              --token="$VERCEL_TOKEN" 2>&1 || true
          else
            echo "No valid URL to alias — skipping"
          fi

      - name: Write LIVE_URL to repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$LIVE_URL" > LIVE_URL.txt
          echo "Pages: / book guidance pathway refer" >> LIVE_URL.txt
          git add LIVE_URL.txt
          git commit -m "chore: update live URL [skip ci]" || true
          git push || true
          echo "LIVE_URL.txt written: $LIVE_URL"

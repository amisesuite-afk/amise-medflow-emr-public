name: Deploy — Amise Front Desk (Vercel)

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install

      - name: Build (Vercel output format)
        working-directory: artifacts/front-desk
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: https://nornhfzfrlmfzaqmrzzp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vcm5oZnpmcmxtZnphcW1yenpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5OTU5NjcsImV4cCI6MjA5NDU3MTk2N30.IQqwEuwp4_CYRj5r6H-83vjXKeob-N8z5TBwLk-rXLc
        run: npx vercel build --yes --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        id: deploy
        working-directory: artifacts/front-desk
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_URL=$(npx vercel deploy --prebuilt --yes --token=$VERCEL_TOKEN 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | tail -1)
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "## Deployed" >> $GITHUB_STEP_SUMMARY
          echo "$DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
          echo "Live at: $DEPLOY_URL"

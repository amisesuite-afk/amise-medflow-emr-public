name: Deploy — Amise Front Desk (Vercel)

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install

      - name: Build
        working-directory: artifacts/front-desk
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: https://nornhfzfrlmfzaqmrzzp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vcm5oZnpmcmxtZnphcW1yenpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5OTU5NjcsImV4cCI6MjA5NDU3MTk2N30.IQqwEuwp4_CYRj5r6H-83vjXKeob-N8z5TBwLk-rXLc
        run: npx vercel build --prod --yes --token=$VERCEL_TOKEN

      - name: Deploy
        id: deploy
        working-directory: artifacts/front-desk
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          echo '=== RAW VERCEL OUTPUT ==='
          npx vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN 2>&1 | tee /tmp/vout.txt
          echo '=== END ==='

          # Try *.vercel.app first, then fall back to any https URL that isn't an inspect link
          URL=$(grep -oE 'https://[^[:space:]"]+\.vercel\.app' /tmp/vout.txt | tail -1)
          if [ -z "$URL" ]; then
            URL=$(grep -oE 'https://[^[:space:]"]+' /tmp/vout.txt | grep -v 'inspect\.vercel' | tail -1)
          fi

          echo "Deployed URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "LIVE_URL=$URL" >> "$GITHUB_ENV"

          {
            echo "# Amise Front Desk"
            echo ""
            echo "**URL: $URL**"
            echo ""
            echo '```'
            cat /tmp/vout.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post live URL as GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh issue create \
            --repo amisesuite-afk/amise-medflow-emr-public \
            --title "Live URL: $LIVE_URL" \
            --body "Amise Front Desk deployed.

**URL:** $LIVE_URL

Pages: / book guidance pathway refer" \
          || echo "Issue creation skipped"

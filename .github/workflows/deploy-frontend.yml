name: Deploy — Amise Front Desk (Vercel)

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install

      - name: Deploy to Vercel
        working-directory: artifacts/front-desk
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: https://nornhfzfrlmfzaqmrzzp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vcm5oZnpmcmxtZnphcW1yenpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5OTU5NjcsImV4cCI6MjA5NDU3MTk2N30.IQqwEuwp4_CYRj5r6H-83vjXKeob-N8z5TBwLk-rXLc
        run: |
          set -e

          # Single command: build + deploy + set production alias
          echo '=== VERCEL DEPLOY ===' 
          npx vercel --prod --yes --token=$VERCEL_TOKEN 2>&1 | tee /tmp/vout.txt
          echo '=== END ==='

          # Show .vercel/project.json so we know what was created
          echo '--- project.json ---'
          cat .vercel/project.json 2>/dev/null || echo '(none)'

          # Extract URL - Vercel outputs the production URL on the last line
          URL=$(grep -oE 'https://[^[:space:]"]+\.vercel\.app' /tmp/vout.txt | tail -1)
          echo "LIVE URL: $URL"

          # Write to GitHub Step Summary
          {
            echo '# 🚀 Amise Front Desk is Live'
            echo ''
            echo "## $URL"
            echo ''
            echo '| Page | Path |'
            echo '|---|---|'
            echo "| Marketing homepage | $URL/ |"
            echo "| Book appointment | $URL/book |"
            echo "| Health guidance | $URL/guidance |"
            echo "| Care pathway | $URL/pathway |"
            echo "| GP referral | $URL/refer |"
            echo ''
            echo '<details><summary>Full deploy log</summary>'
            echo ''
            echo '```'
            cat /tmp/vout.txt
            echo '```'
            echo '</details>'
          } >> $GITHUB_STEP_SUMMARY

          # Update repo homepage so it's findable
          if [ -n "$URL" ]; then
            gh repo edit amisesuite-afk/amise-medflow-emr-public --homepage "$URL" || true
          fi

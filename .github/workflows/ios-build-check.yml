name: iOS — Compile Check

# Compile-only build for feature branches: no signing, no secrets, no upload.
# TestFlight releases stay in ios.yml (main only).

on:
  push:
    branches: ['claude/**']
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build-check.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile (no signing)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Same Xcode selection as ios.yml so both workflows compile with one SDK.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      # Real Configuration.xcconfig holds Supabase keys and is gitignored;
      # placeholders are enough to compile.
      - name: Use placeholder configuration
        working-directory: ios
        run: cp Configuration.xcconfig.example Configuration.xcconfig

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project AmiseMedFlow.xcodeproj -scheme AmiseMedFlow \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Error summary
        if: always()
        working-directory: ios
        run: |
          echo "==== COMPILER ERRORS ===="
          grep -E 'error:' build.log | sed 's|.*/AmiseMedFlow/||' | sort -u || true
          echo "==== RESULT ===="
          grep -E '\*\* BUILD (SUCCEEDED|FAILED) \*\*' build.log || echo "no BUILD result line (failed before compiling)"

  unit-tests:
    name: Unit tests (simulator)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Use placeholder configuration
        working-directory: ios
        run: cp Configuration.xcconfig.example Configuration.xcconfig

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Pick an available iPhone simulator on the newest installed iOS runtime.
      - name: Test
        working-directory: ios
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          d = json.load(sys.stdin)['devices']
          for runtime in sorted((k for k in d if 'iOS' in k), reverse=True):
              phones = [x for x in d[runtime] if x['name'].startswith('iPhone')]
              if phones:
                  print(phones[0]['udid']); break
          ")
          echo "Simulator: $UDID"
          xcodebuild -project AmiseMedFlow.xcodeproj -scheme AmiseMedFlow \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee test.log

      - name: Test summary
        if: always()
        working-directory: ios
        run: |
          echo "==== FAILURES ===="
          grep -E "error:|Test Case .* failed" test.log | sed 's|.*/AmiseMedFlow[A-Za-z]*/||' | sort -u || true
          echo "==== TOTALS ===="
          grep -E "Executed [0-9]+ test|\*\* TEST (SUCCEEDED|FAILED) \*\*" test.log | tail -3 || true

      # Clinical validation (ClinicalValidationTests): one "CLINVAL|{json}" line per vignette in the
      # test log. Collected for scripts/src/clinval/report.ts; never changes the job result.
      - name: Extract clinical validation results
        if: always()
        working-directory: ios
        run: |
          grep -a -o 'CLINVAL|{.*}' test.log 2>/dev/null | sed 's/^CLINVAL|//' > clinval-ios.jsonl || true
          if [ ! -s clinval-ios.jsonl ] && [ -s clinval-ios-direct.jsonl ]; then
            cp clinval-ios-direct.jsonl clinval-ios.jsonl
          fi
          echo "Vignette results: $(wc -l < clinval-ios.jsonl | tr -d ' ')"
          grep -a -o 'CLINVAL-SUMMARY|{.*}' test.log 2>/dev/null | tail -1 || true

      - name: Upload clinical validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clinval-ios
          path: ios/clinval-ios.jsonl
          if-no-files-found: warn
          retention-days: 30

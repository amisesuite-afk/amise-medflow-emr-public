name: Run DB Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run" to confirm executing migrations on production'
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'run' }}
    env:
      PROJECT_REF: nornhfzfrlmfzaqmrzzp
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Run base schema
        run: |
          QUERY=$(jq -Rs . < supabase-schema.sql)
          curl -sf -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $QUERY}" | jq .

      - name: "Migration 1: Clinical records"
        run: |
          QUERY=$(jq -Rs . < supabase-clinical-records-migration.sql)
          curl -sf -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $QUERY}" | jq .


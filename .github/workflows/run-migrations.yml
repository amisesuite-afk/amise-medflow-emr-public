name: Run DB Migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run" to confirm executing migrations on production'
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'run' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/session-setup-MGrDO

      - name: Run clinical-records migration
        run: |
          QUERY=$(jq -Rs . < supabase-clinical-records-migration.sql)
          curl -sf -X POST "https://api.supabase.com/v1/projects/nornhfzfrlmfzaqmrzzp/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $QUERY}" \
            | jq .

      - name: Run patient-portal migration
        run: |
          QUERY=$(jq -Rs . < supabase-patient-portal-migration.sql)
          curl -sf -X POST "https://api.supabase.com/v1/projects/nornhfzfrlmfzaqmrzzp/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $QUERY}" \
            | jq .

      - name: Done
        run: echo "Both migrations applied successfully."

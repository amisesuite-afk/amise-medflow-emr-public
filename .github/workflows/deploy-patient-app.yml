name: Deploy — AMISE Patient App (Vercel)

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/patient-app/**'
      - '.github/workflows/deploy-patient-app.yml'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install

      - name: Discover Vercel org and project IDs (create project if absent)
        id: vercel-ids
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== User info ==="
          USER_JSON=$(curl -sf "https://api.vercel.com/v2/user" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "$USER_JSON" | python3 -c "
          import sys, json; u=json.load(sys.stdin)['user']
          print(f\"username={u.get('username')}  id={u.get('id')}\")
          " || true

          echo "=== Teams ==="
          TEAMS_JSON=$(curl -sf "https://api.vercel.com/v2/teams" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "$TEAMS_JSON" | python3 -c "
          import sys, json
          for t in json.load(sys.stdin).get('teams', []):
            print(f\"  slug={t.get('slug')}  id={t.get('id')}\")
          " || true

          echo "=== Projects ==="
          PROJ_JSON=$(curl -sf "https://api.vercel.com/v9/projects?limit=100" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "$PROJ_JSON" | python3 -c "
          import sys, json
          for p in json.load(sys.stdin).get('projects', []):
            aliases = [a.get('domain','') for a in p.get('alias', [])]
            print(f\"  name={p['name']}  id={p['id']}  aliases={aliases}\")
          " || echo "$PROJ_JSON"

          # Extract org ID (prefer team, fall back to personal user ID)
          ORG_ID=$(echo "$TEAMS_JSON" | python3 -c "
          import sys, json
          teams = json.load(sys.stdin).get('teams', [])
          print(teams[0]['id'] if teams else '')
          " 2>/dev/null || true)

          if [ -z "$ORG_ID" ]; then
            ORG_ID=$(echo "$USER_JSON" | python3 -c "
          import sys, json; print(json.load(sys.stdin)['user']['id'])
          " 2>/dev/null || true)
          fi

          # Find the 'patient-app' project ID
          PROJECT_ID=$(echo "$PROJ_JSON" | python3 -c "
          import sys, json
          ps = json.load(sys.stdin).get('projects', [])
          p = next((x for x in ps if x['name'] == 'patient-app'), None)
          print(p['id'] if p else '')
          " 2>/dev/null || true)

          # Create project if it doesn't exist
          if [ -z "$PROJECT_ID" ]; then
            echo "=== Project 'patient-app' not found — creating ==="
            CREATE_RESP=$(curl -sf -X POST \
              "https://api.vercel.com/v10/projects?teamId=$ORG_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"patient-app","framework":null}')
            echo "$CREATE_RESP" | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          print(f\"Created project id={r.get('id')}  name={r.get('name')}\")
          " || echo "$CREATE_RESP"
            PROJECT_ID=$(echo "$CREATE_RESP" | python3 -c "
          import sys, json; print(json.load(sys.stdin)['id'])
          " 2>/dev/null || true)
          else
            echo "Found existing project: $PROJECT_ID"
          fi

          echo "org_id=$ORG_ID"           >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID"   >> "$GITHUB_OUTPUT"
          echo "VERCEL_ORG_ID=$ORG_ID"         >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

          {
            echo "## Vercel project discovery — patient-app"
            echo '```'
            echo "ORG_ID=$ORG_ID"
            echo "PROJECT_ID=$PROJECT_ID"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Vercel project (rootDirectory, disable protection)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ steps.vercel-ids.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-ids.outputs.project_id }}
        run: |
          echo "=== Setting rootDirectory ==="
          curl -sf -X PATCH \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory":"artifacts/patient-app","framework":null}' \
            | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          print(f\"rootDirectory={r.get('rootDirectory')}  framework={r.get('framework')}\")
          " || true

          # Patient app is accessed directly by patients — disable Vercel
          # Authentication so patients don't need a Vercel account to view it.
          echo "=== Disabling deployment protection ==="
          curl -sf -X PATCH \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ssoProtection":null,"passwordProtection":null,"vercelAuthentication":null}' \
            | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          print(f\"ssoProtection={r.get('ssoProtection')}  passwordProtection={r.get('passwordProtection')}\")
          " || true

          echo "Done configuring project"

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ steps.vercel-ids.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.vercel-ids.outputs.project_id }}
        run: |
          set -e
          echo '=== Vercel deploy (production from source) ==='
          npx vercel@54.6.1 deploy --prod --yes --no-color --token="$VERCEL_TOKEN" 2>&1 | tee /tmp/vdeploy.txt
          echo '=== end ==='

          URL=$(sed 's/\x1b\[[0-9;]*[mK]//g' /tmp/vdeploy.txt \
            | grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' \
            | grep -v 'inspect' | tail -1)

          if [ -z "$URL" ]; then
            URL=$(sed 's/\x1b\[[0-9;]*[mK]//g' /tmp/vdeploy.txt \
              | grep -v '^[[:space:]]*$' | tail -1 | tr -d '[:space:]')
          fi

          echo "PATIENT_APP_URL=$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PATIENT_APP_URL=$URL" >> "$GITHUB_ENV"

          {
            echo "## Patient App Live URL"
            echo ""
            echo "**$URL**"
            echo ""
            echo "<details><summary>vercel deploy log</summary>"
            echo ""
            echo '```'
            cat /tmp/vdeploy.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write PATIENT_APP_URL to repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATIENT_APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$PATIENT_APP_URL" > PATIENT_APP_URL.txt
          echo "Screens: Passport · Pre-Visit · Monitoring · Upload · Messages" >> PATIENT_APP_URL.txt
          git add PATIENT_APP_URL.txt
          git commit -m "chore: update patient app URL [skip ci]" || true
          git push || true
          echo "PATIENT_APP_URL.txt written: $PATIENT_APP_URL"

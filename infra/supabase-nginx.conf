# Nginx reverse proxy for self-hosted Supabase
# Place in /etc/nginx/sites-available/supabase and symlink to sites-enabled/
#
# Prerequisites:
#   1. Point your DNS A record for both domains to this server's IP.
#   2. Install Certbot:  apt install certbot python3-certbot-nginx
#   3. Obtain certificates:
#        certbot --nginx -d supabase.yourdomain.com -d studio.yourdomain.com
#      Certbot will auto-patch the ssl_certificate lines below.
#
# Supabase Docker ports (from supabase/docker/docker-compose.yml):
#   Kong API gateway  → 127.0.0.1:8000
#   Studio UI         → 127.0.0.1:3000
#
# Replace every occurrence of yourdomain.com before deploying.

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name supabase.yourdomain.com studio.yourdomain.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── Supabase API (Kong gateway) ──────────────────────────────────────────────
# This is the URL you put in SUPABASE_URL / VITE_SUPABASE_URL

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supabase.yourdomain.com;

    # Certbot fills these in; leave as placeholders until you run certbot
    ssl_certificate     /etc/letsencrypt/live/supabase.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           DENY                                  always;
    add_header X-Content-Type-Options    nosniff                               always;

    # Max upload size (for document/image uploads in the EMR)
    client_max_body_size 50M;

    # ── REST, Auth, Storage, Edge Functions ─────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Needed for Supabase auth redirects to produce correct URLs
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Realtime WebSocket (iOS uses this for instant check-in push) ─────────
    location /realtime/v1/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive — realtime subscriptions are long-lived
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 60s;
    }
}

# ── Supabase Studio (admin UI) ───────────────────────────────────────────────
# Access this from the clinic's internal network only (see allow/deny below).
# To skip Studio exposure entirely, delete this server block.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/supabase.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Restrict Studio to your clinic's LAN / VPN — change to your actual subnet
    allow 192.168.1.0/24;
    # allow 100.64.0.0/10;  # uncomment if using Tailscale
    deny  all;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

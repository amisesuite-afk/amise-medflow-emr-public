<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#030C12"/>

  <!-- Radar rings (dim — cross sits on top) -->
  <circle cx="90" cy="90" r="11" stroke="#0A3C4B" stroke-width="1" stroke-opacity="0.4" fill="none"/>
  <circle cx="90" cy="90" r="22" stroke="#0A3C4B" stroke-width="1" stroke-opacity="0.4" fill="none"/>
  <circle cx="90" cy="90" r="33" stroke="#0A3C4B" stroke-width="1" stroke-opacity="0.4" fill="none"/>
  <circle cx="90" cy="90" r="44" stroke="#0A3C4B" stroke-width="1" stroke-opacity="0.4" fill="none"/>
  <circle cx="90" cy="90" r="55" stroke="#0A3C4B" stroke-width="1" stroke-opacity="0.4" fill="none"/>
  <circle cx="90" cy="90" r="66" stroke="#0A3C4B" stroke-width="1" stroke-opacity="0.4" fill="none"/>
  <circle cx="90" cy="90" r="77" stroke="#0F5A6E" stroke-width="2" stroke-opacity="0.7" fill="none"/>

  <!-- Cardinal spokes (teal, from cross edge outward) -->
  <g stroke="#00D4E8" stroke-width="1.2" stroke-opacity="0.5">
    <line x1="90" y1="43" x2="90" y2="13"/>
    <line x1="90" y1="137" x2="90" y2="167"/>
    <line x1="137" y1="90" x2="167" y2="90"/>
    <line x1="43" y1="90" x2="13" y2="90"/>
  </g>

  <!-- Minor spokes (outer half only, dim) -->
  <g stroke="#0A3C4B" stroke-width="0.8" stroke-opacity="0.3">
    <line x1="110" y1="53" x2="130" y2="30"/>
    <line x1="130" y1="110" x2="153" y2="130"/>
    <line x1="70"  y1="127" x2="50"  y2="150"/>
    <line x1="50"  y1="70"  x2="27"  y2="50"/>
    <line x1="115" y1="77"  x2="155" y2="63"/>
    <line x1="103" y1="115" x2="117" y2="158"/>
    <line x1="77"  y1="103" x2="25"  y2="117"/>
    <line x1="65"  y1="77"  x2="23"  y2="63"/>
  </g>

  <!-- White rounded cross -->
  <rect x="76" y="43" width="28" height="94" rx="14" fill="white" fill-opacity="0.92"/>
  <rect x="43" y="76" width="94" height="28" rx="14" fill="white" fill-opacity="0.92"/>

  <!-- Teal glow dot at center (through the cross) -->
  <circle cx="90" cy="90" r="18" fill="#00D4E8" fill-opacity="0.06"/>
  <circle cx="90" cy="90" r="12" fill="#00D4E8" fill-opacity="0.14"/>
  <circle cx="90" cy="90" r="7"  fill="#00D4E8" fill-opacity="0.38"/>
  <circle cx="90" cy="90" r="4"  fill="#00D4E8" fill-opacity="0.75"/>
  <circle cx="90" cy="90" r="2.5" fill="#00D4E8"/>
</svg>

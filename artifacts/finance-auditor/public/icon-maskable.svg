<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full bleed background (maskable — safe zone is inner 80%) -->
  <rect width="512" height="512" fill="#0a1420"/>
  <!-- Chart bars (within safe zone ~102–410) -->
  <rect x="102" y="210" width="56" height="190" rx="5" fill="#1a6aff" opacity="0.9"/>
  <rect x="186" y="155" width="56" height="245" rx="5" fill="#4a9eff" opacity="0.9"/>
  <rect x="270" y="120" width="56" height="280" rx="5" fill="#34d399" opacity="0.9"/>
  <rect x="354" y="170" width="56" height="230" rx="5" fill="#1a6aff" opacity="0.7"/>
  <!-- Baseline -->
  <rect x="82" y="398" width="348" height="7" rx="3" fill="#1e3a5f"/>
  <!-- Dollar -->
  <text x="256" y="108" font-size="52" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" fill="#4a9eff">$</text>
</svg>

services:
  - type: web
    name: amise-medflow-api
    runtime: node
    plan: standard
    buildCommand: npx --yes pnpm@10 install --no-frozen-lockfile && cd artifacts/api-server && node build.mjs
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MODE
        value: supervised
      - key: SMS_PROVIDER
        value: twilio
      - key: SESSION_SECRET
        generateValue: true
      - key: GMAIL_USER
        value: amisesuite@gmail.com
      # Calendar IDs — MUST be updated in Render dashboard before going live.
      # Obtain each calendar ID from Google Calendar → Settings → that calendar's settings page
      # (format is usually xxxxxxxx@group.calendar.google.com for shared calendars).
      # These placeholder values will produce a Google Calendar API 404 on first use,
      # making it obvious they have not been configured.
      - key: CALENDAR_ID_RODNEY_BAY
        value: UNCONFIGURED_RODNEY_BAY@group.calendar.google.com
      - key: CALENDAR_ID_TAPION_ERCP
        value: UNCONFIGURED_TAPION_ERCP@group.calendar.google.com
      # Machine secret for the x-staff-token header (front-desk → api-server).
      # No value here: set it in the Render dashboard, and the same value in the
      # front-desk Vercel project. While unset the api-server falls back to
      # CRON_SECRET and logs a warning.
      - key: STAFF_MACHINE_TOKEN
        sync: false
      # ── Cron job URLs (set in Render dashboard → Cron Jobs, or use
      #    an external cron service like cron-job.org to POST to these) ──
      # POST /api/cron/reminders         — every 30 min (48h SMS + 24h email + post-visit)
      # POST /api/cron/booking-reminders — every 30 min (confirmation SMS for staff-confirmed)
      # POST /api/cron/staff-escalation  — every 30 min (re-notify on unactioned bookings)
      # POST /api/cron/calendar-sync     — every 15 min (sync Google Calendar to local cache)
      # POST /api/cron/email-documents   — every 15 min (poll Gmail for incoming lab/pathology/imaging results)
      # POST /api/cron/daily-summary     — once daily at 06:00 ECT (appointment + escalation digest)
      # POST /api/booking/lapse          — once daily at 00:00 ECT (mark unconfirmed as lapsed)
      # All require header: x-cron-secret: <CRON_SECRET value>

      # ── Optional — monitoring ──
      # SENTRY_DSN               = https://…@….ingest.sentry.io/…
      # STAFF_NOTIFY_PHONE       = +1758…
      # PRACTICE_PHONE           = +17582840557
      # LOG_LEVEL                = info

      # ── Set these in Render dashboard → Environment ──
      # SUPABASE_URL            = https://nornhfzfrlmfzaqmrzzp.supabase.co
      # SUPABASE_SERVICE_ROLE_KEY = …
      # ANTHROPIC_API_KEY       = sk-ant-…
      # DISABLE_AI              = true   (optional AI kill switch — stops every Anthropic/Whisper call)
      # GOOGLE_OAUTH_CLIENT_ID  = …
      # GOOGLE_OAUTH_CLIENT_SECRET = …
      # GOOGLE_OAUTH_REFRESH_TOKEN = …
      # GOOGLE_SERVICE_ACCOUNT_JSON = { … }
      # TWILIO_ACCOUNT_SID      = …
      # TWILIO_AUTH_TOKEN        = …
      # TWILIO_FROM_NUMBER       = +1758…
      # CRON_SECRET              = (any strong random string; cron jobs only)
      # STAFF_MACHINE_TOKEN      = (a different strong random string; see envVars above)
      # DOCTOR_NOTIFY_EMAIL      = amisesuite@gmail.com
      # STAFF_NOTIFY_EMAIL       = amisesuite@gmail.com
      #
      # ── CORS / portal URLs (required for cross-origin API calls) ──
      # PORTAL_URL    = https://front-desk-amisesuite-afks-projects.vercel.app
      # DASHBOARD_URL = https://dashboard-lemon-gamma-44.vercel.app
      #
      # Both accept a comma-separated list (lib/site-urls.ts). CORS allows every
      # entry; links sent to patients (SMS, WhatsApp, portal invites) use the
      # FIRST PORTAL_URL entry only — put the primary domain first. Once the
      # custom domains are live (docs/DOMAINS.md):
      # PORTAL_URL = https://amisemedical.com,https://www.amisemedical.com,https://amisesuite.com,https://www.amisesuite.com,https://front-desk-amisesuite-afks-projects.vercel.app

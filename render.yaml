services:
  - type: web
    name: amise-medflow-api
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@10 install --no-frozen-lockfile && cd artifacts/api-server && node build.mjs
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MODE
        value: dry_run
      - key: SMS_PROVIDER
        value: dry_run
      - key: SESSION_SECRET
        generateValue: true
      - key: GMAIL_USER
        value: amisesuite@gmail.com
      - key: CALENDAR_ID_RODNEY_BAY
        value: amisesuite@gmail.com
      - key: CALENDAR_ID_CASTRIES
        value: amisesuite@gmail.com
      - key: CALENDAR_ID_TAPION_ERCP
        value: amisesuite@gmail.com
      # Add these in Render dashboard → Environment:
      # ANTHROPIC_API_KEY=sk-ant-...
      # GOOGLE_OAUTH_REFRESH_TOKEN=...
      # GOOGLE_OAUTH_CLIENT_ID=...
      # GOOGLE_OAUTH_CLIENT_SECRET=...
      # SUPABASE_URL=https://nornhfzfrlmfzaqmrzzp.supabase.co
      # SUPABASE_SERVICE_ROLE_KEY=sb_secret_...   ← required for /api/patient/invite
      # PORTAL_URL=https://front-desk-amisesuite-afks-projects.vercel.app/patient
